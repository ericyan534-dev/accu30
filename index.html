      THESIS: This organisation is putting up a building, so the site is the
      board that announces what is inside one. It refuses the nonprofit
      default of a smiling-faces photo hero over mission-and-impact stats.

      OWN-WORLD: Cool stone ground (#E6E8E7) carrying monumental quiet; dark
      slate boards (#14181A) carrying dense ranked listings; bronze (#6F5B3E)
      as plate material and cut-highlight only, never as a text colour;
      vermillion (#C4282D) sampled from the dragon, the sole identity colour.
      Letters are incised, not printed. Archivo (width axis) for all signage
      and listings; Source Serif 4 for prose.

      STORY: A skeptical institutional reader learns in seconds that ACC-U30
      incubates four operating ventures and is developing a New York
      building, sees the whole organisation indexed, and asks for a meeting.
      A nominated under-30 reader sees a standard worth being invited into.

      FIRST VIEWPORT: Stone facade. The mission cut monumentally at left with
      vermillion carrying its second half; the dragon in relief at right;
      "Partner with us" and a secondary action on the baseline; a status rail
      beneath. The directory board arrives on the next scroll.

      FORM: The building lobby directory. Navigation is the listing, sections
      carry floor numbers, ventures are tenants, reference imagery appears
      only in framed and captioned plates. The building is PLANNED — nothing
      may present it as existing.
